---
# Fail2Ban Configuration Playbook
- name: Install and configure Fail2Ban
  hosts: all
  become: yes
  tasks:
    - name: Install EPEL repository
      dnf:
        name: epel-release
        state: present

    - name: Install Fail2Ban
      dnf:
        name: fail2ban
        state: present

    - name: Create Fail2Ban SSH jail config
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 3
          banaction = firewallcmd-rich-rules

          [sshd]
          enabled = true
          port = 2222
          logpath = /var/log/secure
          maxretry = 3

    - name: Start and enable Fail2Ban
      service:
        name: fail2ban
        state: started
        enabled: yes
